<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Sintesi Vocale - im_oscar</title>
    <style>
        body { 
            font-family: sans-serif; 
            background: #ffffff; 
            color: #333333; 
            max-width: 750px; 
            margin: 40px auto; 
            padding: 20px; 
        }
        h2 { color: #111111; }
        .info-box { 
            background: #ffffff; 
            border: 1px solid #333333; 
            padding: 15px; 
            margin-bottom: 20px; 
            font-weight: bold;
        }
        textarea { 
            width: 100%; 
            height: 200px; 
            padding: 12px; 
            font-size: 16px; 
            margin-bottom: 15px; 
            background: #ffffff; 
            border: 1px solid #333333; 
            color: #333333; 
            resize: vertical; 
        }
        button { 
            background: #ffffff; 
            color: #333333; 
            border: 1px solid #333333; 
            padding: 12px 24px; 
            font-size: 16px; 
            cursor: pointer; 
            font-weight: bold; 
        }
        button:hover { background: #f0f0f0; }
        #status { 
            margin-top: 15px; 
            font-weight: bold; 
            padding: 10px;
            border: 1px dashed #333333;
            background: #ffffff;
        }
        audio { margin-top: 15px; width: 100%; }
    </style>
</head>
<body>
    <h2>Generatore Vocale HTML5 - im_oscar</h2>
    
    <div class="info-box">
        Motore attivo con voce personalizzata: <strong>im_oscar.bin.npz</strong>
    </div>

    <label for="testo">Inserisci il testo:</label><br>
    <textarea id="testo">Notiziario delle ore 8:15 dal comune di Formigine. Riferimento n. 3331234567.</textarea><br>
    
    <button id="btnSintesi" type="button">Sintetizza</button>
    
    <div id="status">Pronto per la sintesi.</div>
    <audio id="audioPlayer" controls style="display:none;"></audio>

    <script type="module">
        import { KokoroTTS } from "https://cdn.jsdelivr.net/npm/kokoro-js@latest/dist/bundler.min.js";

        let ttsInstance = null;
        const status = document.getElementById('status');
        const player = document.getElementById('audioPlayer');
        const btnSintesi = document.getElementById('btnSintesi');

        function aggiornaStato(msg, colore = "#333333") {
            status.style.color = colore;
            status.innerText = msg;
        }

        function formattaTesto(testoInput) {
            let testo = testoInput
                .replace(/\b[nN]\.?\s*(\d)/g, '$1')
                .replace(/\b8:15\b/g, 'otto e un quarto')
                .replace(/\b8:30\b/g, 'otto e mezza')
                .replace(/\b10:30\b/g, 'dieci e mezza')
                .replace(/Formigine/gi, 'Formígine');

            // Legge i numeri telefonici o sequenze di 6+ cifre cifra per cifra
            testo = testo.replace(/\b\d{6,}\b/g, (match) => match.split('').join(' '));
            
            return testo;
        }

        btnSintesi.addEventListener('click', async () => {
            try {
                player.style.display = 'none';
                const testoInput = document.getElementById('testo').value;
                
                if (!testoInput.trim()) {
                    alert("Inserisci del testo.");
                    return;
                }

                if (!ttsInstance) {
                    aggiornaStato("Inizializzazione motore Kokoro e caricamento voce im_oscar...");
                    
                    ttsInstance = await KokoroTTS.from_pretrained("onnx-community/Kokoro-82M-ONNX", { 
                        dtype: "fp32",
                        progress_callback: (progress) => {
                            if (progress.status === 'downloading') {
                                aggiornaStato(`Scaricamento risorse: ${Math.round(progress.loaded / 1024 / 1024)} MB`);
                            }
                        }
                    });
                }

                aggiornaStato("Formattazione del testo...");
                const testoFormattato = formattaTesto(testoInput);

                aggiornaStato("Generazione audio con im_oscar in corso...");
                
                // Carica il file im_oscar.bin.npz dalla stessa cartella del repository
                const audio = await ttsInstance.generate(testoFormattato, {
                    voice: "./im_oscar.bin.npz", 
                    speed: 0.9
                });

                const blob = audio.toBlob();
                player.src = URL.createObjectURL(blob);
                player.style.display = 'block';
                
                await player.play().catch(() => {
                    aggiornaStato("Audio pronto. Premi play sul lettore qui sotto.", "#2b542c");
                });

                if (!player.paused) {
                    aggiornaStato("Sintesi completata con successo!", "#2b542c");
                }
            } catch (err) {
                aggiornaStato("Errore: " + err.message, "#d9534f");
                console.error(err);
            }
        });
    </script>
</body>
</html>
