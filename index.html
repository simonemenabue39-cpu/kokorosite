<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kokoro-82M TTS - Italiano Perfetto</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 720px;
        }
        h2 {
            margin-top: 0;
            color: #1a1a1a;
            font-size: 1.5rem;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 0.9rem;
        }
        select, textarea, button, input[type="range"] {
            width: 100%;
            box-sizing: border-box;
            border-radius: 8px;
            font-size: 1rem;
        }
        select {
            padding: 10px;
            border: 1px solid #ccc;
            margin-bottom: 16px;
            background-color: #ffffff;
            color: #1a1a1a;
        }
        textarea {
            padding: 12px;
            border: 1px solid #ccc;
            resize: vertical;
            min-height: 210px;
            margin-bottom: 12px;
            font-family: inherit;
            background-color: #ffffff;
            color: #1a1a1a;
            line-height: 1.5;
        }
        .file-btns {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
        }
        .file-btns button {
            background-color: #ffffff;
            color: #1a1a1a;
            border: 1px solid #ccc;
            padding: 9px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, border-color 0.2s;
        }
        .file-btns button:hover {
            background-color: #f0f2f5;
            border-color: #999;
        }
        .speed-box {
            margin-bottom: 16px;
        }
        button#generateBtn {
            background-color: #ffffff;
            color: #1d4ed8;
            border: 2px solid #2563eb;
            padding: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }
        button#generateBtn:hover:not(:disabled) {
            background-color: #eff6ff;
        }
        button:disabled {
            background-color: #ffffff;
            color: #9ca3af;
            border-color: #d1d5db;
            cursor: not-allowed;
        }
        .status {
            margin-top: 15px;
            font-size: 0.92rem;
            color: #4b5563;
            text-align: center;
            min-height: 22px;
        }
        audio {
            width: 100%;
            margin-top: 20px;
            display: none;
        }
        #fileInput {
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Kokoro-82M TTS - Italiano Perfetto</h2>

    <label for="voiceSelect">Scegli la voce italiana:</label>
    <select id="voiceSelect">
        <option value="if_sara">Sara (if_sara - Femminile Italiano)</option>
        <option value="im_nicola">Nicola (im_nicola - Maschile Italiano)</option>
    </select>

    <div class="speed-box">
        <label for="speedRange">Velocità voce: <span id="speedVal">0.95</span>x</label>
        <input type="range" id="speedRange" min="0.7" max="1.3" step="0.05" value="0.95">
    </div>

    <label for="textInput">Testo da sintetizzare:</label>
    <textarea id="textInput" placeholder="Inserisci qui il testo completo...">Comune di Formigine. Regolamento di polizia mortuaria e atto di nascita registrato nell'anno 2026 in data 13/11/2026. Gli uffici ricevono dalle ore 8.15 alle ore 10:30. Per informazioni chiamare il n. 059 416111 oppure il 333 1234567.</textarea>

    <div class="file-btns">
        <button id="saveFileBtn" type="button">Salva Testo su PC</button>
        <button id="loadFileBtn" type="button">Carica Testo da PC</button>
        <input type="file" id="fileInput" accept=".txt">
    </div>

    <button id="generateBtn" type="button" disabled>Caricamento motore Kokoro...</button>

    <div class="status" id="statusText">Inizializzazione in corso...</div>

    <audio id="audioPlayer" controls></audio>
</div>

<script type="module">
    import { AutoTokenizer, AutoModel, Tensor, env } from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.4.1/+esm";

    env.allowLocalModels = false;
    env.useBrowserCache = true;

    const MODEL_ID = "onnx-community/Kokoro-82M-v1.0-ONNX";

    const generateBtn = document.getElementById("generateBtn");
    const statusText = document.getElementById("statusText");
    const textInput = document.getElementById("textInput");
    const voiceSelect = document.getElementById("voiceSelect");
    const speedRange = document.getElementById("speedRange");
    const speedVal = document.getElementById("speedVal");
    const audioPlayer = document.getElementById("audioPlayer");
    const saveFileBtn = document.getElementById("saveFileBtn");
    const loadFileBtn = document.getElementById("loadFileBtn");
    const fileInput = document.getElementById("fileInput");

    let tokenizer = null;
    let model = null;
    const voiceCache = {};
    let currentUrl = null;

    speedRange.addEventListener("input", () => {
        speedVal.textContent = parseFloat(speedRange.value).toFixed(2);
    });

    // Salvataggio testo su PC
    saveFileBtn.addEventListener("click", () => {
        const text = textInput.value;
        const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "testo_sintesi.txt";
        a.click();
        URL.revokeObjectURL(url);
    });

    // Caricamento testo da PC
    loadFileBtn.addEventListener("click", () => fileInput.click());
    fileInput.addEventListener("change", (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
            textInput.value = event.target.result;
            statusText.textContent = "File caricato con successo!";
        };
        reader.readAsText(file);
    });

    const digitWords = {
        '0': 'zero', '1': 'uno', '2': 'due', '3': 'tre', '4': 'quattro',
        '5': 'cinque', '6': 'sei', '7': 'sette', '8': 'otto', '9': 'nove'
    };

    const monthNames = {
        '01': 'gennaio', '1': 'gennaio',
        '02': 'febbraio', '2': 'febbraio',
        '03': 'marzo', '3': 'marzo',
        '04': 'aprile', '4': 'aprile',
        '05': 'maggio', '5': 'maggio',
        '06': 'giugno', '6': 'giugno',
        '07': 'luglio', '7': 'luglio',
        '08': 'agosto', '8': 'agosto',
        '09': 'settembre', '9': 'settembre',
        '10': 'ottobre',
        '11': 'novembre',
        '12': 'dicembre'
    };

    function numberToItalianWords(numStr) {
        const n = parseInt(numStr, 10);
        if (isNaN(n)) return numStr;
        if (n === 0) return 'zero';

        const unita = ['', 'uno', 'due', 'tre', 'quattro', 'cinque', 'sei', 'sette', 'otto', 'nove'];
        const speciali = ['dieci', 'undici', 'dodici', 'tredici', 'quattordici', 'quindici', 'sedici', 'diciassette', 'diciotto', 'diciannove'];
        const decine = ['', '', 'venti', 'trenta', 'quaranta', 'cinquanta', 'sessanta', 'settanta', 'ottanta', 'novanta'];

        function convertBelow1000(val) {
            let res = '';
            const c = Math.floor(val / 100);
            const r = val % 100;
            if (c > 0) {
                res += (c === 1 ? 'cento' : unita[c] + 'cento');
            }
            if (r > 0) {
                if (r < 10) res += unita[r];
                else if (r < 20) res += speciali[r - 10];
                else {
                    const d = Math.floor(r / 10);
                    const u = r % 10;
                    let dStr = decine[d];
                    if (u === 1 || u === 8) {
                        dStr = dStr.slice(0, -1);
                    }
                    res += dStr + unita[u];
                }
            }
            return res;
        }

        if (n < 1000) return convertBelow1000(n);
        if (n < 1000000) {
            const migliaia = Math.floor(n / 1000);
            const resto = n % 1000;
            let migStr = (migliaia === 1 ? 'duemila'.slice(3) : convertBelow1000(migliaia) + 'mila');
            if (migliaia === 1) migStr = 'mille';
            // Spazio naturale dopo "duemila" per scandire bene gli anni (es. 2026 -> "duemila ventisei")
            if (migliaia === 2 && resto > 0) {
                return 'duemila ' + convertBelow1000(resto);
            }
            return migStr + (resto > 0 ? convertBelow1000(resto) : '');
        }
        return numStr;
    }

    function formatTimeItalian(hStr, mStr) {
        const hourWords = {
            '0': 'zero', '1': 'una', '2': 'due', '3': 'tre', '4': 'quattro', '5': 'cinque',
            '6': 'sei', '7': 'sette', '8': 'otto', '9': 'nove', '10': 'dieci',
            '11': 'undici', '12': 'dodici', '13': 'tredici', '14': 'quattordici', '15': 'quindici',
            '16': 'sedici', '17': 'diciassette', '18': 'diciotto', '19': 'diciannove',
            '20': 'venti', '21': 'ventuno', '22': 'ventidue', '23': 'ventitré'
        };
        const hNum = parseInt(hStr, 10);
        const mNum = parseInt(mStr, 10);
        const hText = hourWords[hNum] || hStr;

        if (mNum === 0) {
            return `le ore ${hText} in punto`;
        } else if (mNum === 15) {
            return `le ore ${hText} e un quarto`;
        } else if (mNum === 30) {
            return `le ore ${hText} e mezza`;
        } else if (mNum === 45) {
            const nextH = (hNum + 1) % 24;
            const nextHText = hourWords[nextH] || nextH;
            return `le ${nextHText} meno un quarto`;
        } else {
            return `le ore ${hText} e ${numberToItalianWords(mStr)}`;
        }
    }

    function spellPhoneDigitsSlowly(rawDigits) {
        const digits = rawDigits.replace(/\D/g, '');
        if (!digits) return '';
        // Inserisce pausa con puntini tra ogni cifra per lettura lenta e scandita, senza usare la parola "mila"
        return digits.split('').map(d => digitWords[d] || d).join('... ');
    }

    function preprocessItalianText(text) {
        let s = text;

        // 1. Rimozione "n." o "N." prima dei numeri telefonici
        s = s.replace(/\bn[°º.]?\s*(?=(?:\+39[\s.-]*)?(?:0\d{1,3}|3\d{2})[\s.-]*\d{5,8}\b)/gi, '');

        // 2. Date complete (es. 13/11/2026 o 13-11-2026 -> tredici novembre duemila ventisei)
        s = s.replace(/\b([0-3]?\d)[\/\-]([0-1]?\d)[\/\-]((?:19|20)\d{2})\b/g, (match, day, month, year) => {
            const dNum = parseInt(day, 10);
            const dWord = dNum === 1 ? 'primo' : numberToItalianWords(String(dNum));
            const mWord = monthNames[month] || numberToItalianWords(month);
            const yWord = numberToItalianWords(year);
            return `${dWord} ${mWord} ${yWord}`;
        });

        // 3. Orari completi con ":" o "." (es. 8.15 -> le ore otto e un quarto, 8:30 -> le ore otto e mezza)
        s = s.replace(/\b(?:alle\s+|dalle\s+|ore\s+)?([0-1]?[0-9]|2[0-3])[:.]([0-5][0-9])\b/gi, (match, h, m) => {
            const prefixMatch = match.match(/^(alle|dalle)\s+/i);
            const prefix = prefixMatch ? prefixMatch[1].toLowerCase() + ' ' : '';
            const formatted = formatTimeItalian(h, m);
            if (prefix) {
                return prefix + formatted.replace(/^le\s+/, '');
            }
            return formatted;
        });

        // 4. Numeri di telefono italiani (fissi con prefisso 0... o cellulari con 3..., con o senza spazi/trattini)
        s = s.replace(/(?:\+39[\s.-]*)?\b(?:0\d{1,3}[\s.-]*\d{5,8}|3\d{2}[\s.-]*\d{6,7}|3\d{2}[\s.-]*\d{3}[\s.-]*\d{3,4})\b/g, (match) => {
            const hasPlus39 = /^\+39/.test(match.trim());
            const cleanDigits = match.replace(/^\+39[\s.-]*/, '');
            const spelled = spellPhoneDigitsSlowly(cleanDigits);
            return hasPlus39 ? `più tre... nove... ${spelled}` : spelled;
        });

        // 5. Eventuali altre sequenze numeriche lunghe (es. codici o numeri > 4 cifre) lette cifra per cifra
        s = s.replace(/\b\d{5,}\b/g, (match) => {
            return spellPhoneDigitsSlowly(match);
        });

        // 6. Anni e numeri interi fino a 4 cifre (es. 2026 -> duemila ventisei)
        s = s.replace(/\b\d{1,4}\b/g, (match) => {
            return numberToItalianWords(match);
        });

        // 7. Dizionario di pronuncia di precisione (accento tonico esplicito per Kokoro)
        s = s.replace(/\bformigine\b/gi, "for-mì-gi-ne");
        s = s.replace(/\bnascita\b/gi, "nà-sci-ta");
        s = s.replace(/\bnascite\b/gi, "nà-sci-te");
        s = s.replace(/\bmortuaria\b/gi, "mor-tu-à-ria");
        s = s.replace(/\bmortuarie\b/gi, "mor-tu-à-rie");
        s = s.replace(/\bpolizia\b/gi, "po-li-tsì-a");

        // 8. Conversione fonetica IPA calibrata per voci italiane Kokoro
        s = s.toLowerCase();
        s = s.replace(/[’']/g, " ");

        // Gestione vocali accentate prima della conversione generale
        s = s.replace(/é/g, "ˈe")
             .replace(/è/g, "ˈɛ")
             .replace(/ò/g, "ˈɔ")
             .replace(/à/g, "ˈa")
             .replace(/ì/g, "ˈi")
             .replace(/ù/g, "ˈu");

        s = s.replace(/gli(?=[aeiouɛɔˈ])/g, "ʎ");
        s = s.replace(/gli\b/g, "ʎi");
        s = s.replace(/gn/g, "ɲ");
        s = s.replace(/sc(?=[ieɛˈ])/g, "ʃ");
        s = s.replace(/sch/g, "sk");
        s = s.replace(/ch/g, "k");
        s = s.replace(/gh/g, "ɡ");
        s = s.replace(/ci(?=[aouɔˈ])/g, "tʃ");
        s = s.replace(/gi(?=[aouɔˈ])/g, "dʒ");
        s = s.replace(/c(?=[ieɛˈ])/g, "tʃ");
        s = s.replace(/g(?=[ieɛˈ])/g, "dʒ");
        s = s.replace(/c/g, "k");
        s = s.replace(/g/g, "ɡ");
        s = s.replace(/qu/g, "kw");
        s = s.replace(/q/g, "k");
        s = s.replace(/z/g, "ts");
        s = s.replace(/h/g, "");

        // Applica l'accento piano predefinito sulle parole senza accento esplicito
        s = s.split(/\s+/).map(word => {
            if (word.includes("ˈ") || word.includes("-") || word.length <= 2) {
                return word.replace(/-/g, "");
            }
            const cleanWord = word.replace(/-/g, "");
            const vowels = [...cleanWord.matchAll(/[aeiouɛɔ]/g)];
            if (vowels.length >= 2) {
                const targetIdx = vowels[vowels.length - 2].index;
                return cleanWord.slice(0, targetIdx) + "ˈ" + cleanWord.slice(targetIdx);
            }
            return cleanWord;
        }).join(" ");

        return s;
    }

    function splitIntoChunks(text, maxChars = 180) {
        if (!text) return [];
        const sentences = text.split(/(?<=[.!?;])\s+/);
        const chunks = [];
        let currentChunk = "";

        for (const sentence of sentences) {
            if ((currentChunk + " " + sentence).trim().length <= maxChars) {
                currentChunk = (currentChunk + " " + sentence).trim();
            } else {
                if (currentChunk) chunks.push(currentChunk);
                if (sentence.length <= maxChars) {
                    currentChunk = sentence;
                } else {
                    // Spezza frasi molto lunghe sugli spazi
                    let idx = 0;
                    while (idx < sentence.length) {
                        let end = idx + maxChars;
                        if (end >= sentence.length) {
                            chunks.push(sentence.slice(idx).trim());
                            break;
                        }
                        let bp = sentence.lastIndexOf(' ', end);
                        if (bp <= idx) bp = end;
                        chunks.push(sentence.slice(idx, bp).trim());
                        idx = bp + 1;
                    }
                    currentChunk = "";
                }
            }
        }
        if (currentChunk) chunks.push(currentChunk);
        return chunks;
    }

    async function loadVoiceEmbedding(voiceName) {
        if (voiceCache[voiceName]) return voiceCache[voiceName];

        const urls = [
            `https://huggingface.co/onnx-community/Kokoro-82M-v1.0-ONNX/resolve/main/voices/${voiceName}.bin`,
            `https://huggingface.co/onnx-community/Kokoro-82M-ONNX/resolve/main/voices/${voiceName}.bin`
        ];

        for (const url of urls) {
            try {
                const res = await fetch(url);
                if (res.ok) {
                    const buf = await res.arrayBuffer();
                    const float32 = new Float32Array(buf);
                    if (float32.length >= 256) {
                        voiceCache[voiceName] = float32;
                        return float32;
                    }
                }
            } catch (e) {
                console.warn(`Tentativo fallito su ${url}:`, e);
            }
        }
        throw new Error(`Impossibile scaricare il file voce ${voiceName}.bin`);
    }

    function encodeWAV(samples, sampleRate = 24000) {
        const buffer = new ArrayBuffer(44 + samples.length * 2);
        const view = new DataView(buffer);

        const writeStr = (offset, str) => {
            for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
        };

        writeStr(0, "RIFF");
        view.setUint32(4, 36 + samples.length * 2, true);
        writeStr(8, "WAVE");
        writeStr(12, "fmt ");
        view.setUint32(16, 16, true);
        view.setUint16(20, 1, true);
        view.setUint16(22, 1, true);
        view.setUint32(24, sampleRate, true);
        view.setUint32(28, sampleRate * 2, true);
        view.setUint16(32, 2, true);
        view.setUint16(34, 16, true);
        writeStr(36, "data");
        view.setUint32(40, samples.length * 2, true);

        let offset = 44;
        for (let i = 0; i < samples.length; i++, offset += 2) {
            const s = Math.max(-1, Math.min(1, samples[i]));
            view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
        }

        return new Blob([view], { type: "audio/wav" });
    }

    async function init() {
        try {
            statusText.textContent = "Scaricamento modello Kokoro-82M (prima volta in cache)...";
            tokenizer = await AutoTokenizer.from_pretrained(MODEL_ID);
            model = await AutoModel.from_pretrained(MODEL_ID, {
                dtype: "q8",
                device: "wasm"
            });

            statusText.textContent = "Scaricamento voci italiane if_sara e im_nicola...";
            await Promise.all([
                loadVoiceEmbedding("if_sara"),
                loadVoiceEmbedding("im_nicola")
            ]);

            statusText.textContent = "Motore Kokoro Italiano pronto! (Sara e Nicola caricati)";
            generateBtn.textContent = "Sintetizza Tutto il Testo";
            generateBtn.disabled = false;
        } catch (error) {
            console.error("Errore inizializzazione:", error);
            statusText.textContent = "Errore caricamento: " + error.message;
        }
    }

    generateBtn.addEventListener("click", async () => {
        const rawText = textInput.value.trim();
        if (!rawText) {
            statusText.textContent = "La textarea è vuota. Inserisci del testo.";
            return;
        }

        const voiceName = voiceSelect.value;
        const speed = parseFloat(speedRange.value);

        generateBtn.disabled = true;
        audioPlayer.style.display = "none";
        statusText.textContent = "Elaborazione testo e sintesi vocale in corso...";

        try {
            const processedText = preprocessItalianText(rawText);
            const chunks = splitIntoChunks(processedText, 180);
            const voiceData = await loadVoiceEmbedding(voiceName);

            const validWaveforms = [];
            for (let i = 0; i < chunks.length; i++) {
                const chunk = chunks[i];
                if (!chunk.trim()) continue;

                statusText.textContent = `Sintesi segmento ${i + 1} di ${chunks.length}...`;

                const encoded = tokenizer(chunk, { truncation: true, max_length: 510 });
                const rawIds = Array.from(encoded.input_ids.data);
                if (rawIds.length === 0) continue;

                // Token di padding iniziale e finale per evitare sfarfugliamenti a fine frase
                const paddedIds = BigInt64Array.from([0n, ...rawIds.map(BigInt), 0n]);
                const inputIdsTensor = new Tensor("int64", paddedIds, [1, paddedIds.length]);

                const tokenCount = Math.min(rawIds.length, 509);
                const offset = tokenCount * 256;
                const styleSlice = voiceData.slice(offset, offset + 256);

                const styleTensor = new Tensor("float32", styleSlice, [1, 256]);
                const speedTensor = new Tensor("float32", new Float32Array([speed]), [1]);

                const outputs = await model({
                    input_ids: inputIdsTensor,
                    style: styleTensor,
                    speed: speedTensor
                });

                validWaveforms.push(outputs.waveform.data);
            }

            if (validWaveforms.length === 0) throw new Error("Nessun audio generato.");

            // Pausa naturale tra i blocchi (250ms a 24kHz) + coda finale pulita
            const silence = new Float32Array(6000);
            const endSilence = new Float32Array(4800);
            const totalLength = validWaveforms.reduce((acc, curr) => acc + curr.length, 0)
                + (validWaveforms.length - 1) * silence.length
                + endSilence.length;

            const combinedWaveform = new Float32Array(totalLength);
            let offsetIdx = 0;

            for (let i = 0; i < validWaveforms.length; i++) {
                combinedWaveform.set(validWaveforms[i], offsetIdx);
                offsetIdx += validWaveforms[i].length;
                if (i < validWaveforms.length - 1) {
                    combinedWaveform.set(silence, offsetIdx);
                    offsetIdx += silence.length;
                }
            }
            combinedWaveform.set(endSilence, offsetIdx);

            const wavBlob = encodeWAV(combinedWaveform, 24000);

            if (currentUrl) URL.revokeObjectURL(currentUrl);
            currentUrl = URL.createObjectURL(wavBlob);

            audioPlayer.src = currentUrl;
            audioPlayer.style.display = "block";
            await audioPlayer.play();

            statusText.textContent = "Sintesi completata!";
        } catch (error) {
            console.error("Errore sintesi:", error);
            statusText.textContent = "Errore durante la generazione: " + error.message;
        } finally {
            generateBtn.disabled = false;
            generateBtn.textContent = "Sintetizza Tutto il Testo";
        }
    });

    init();
</script>

</body>
</html>
