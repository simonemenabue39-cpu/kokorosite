<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kokoro-82M Italiano - Comune Formīgine</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 650px;
        }
        h2 { margin-top: 0; color: #1a1a1a; font-size: 1.5rem; }
        label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 0.9rem; }
        select, textarea, button, input[type="range"], input[type="text"] {
            width: 100%;
            box-sizing: border-box;
            border-radius: 8px;
            font-size: 1rem;
        }
        select, input[type="text"] {
            padding: 10px;
            border: 1px solid #ccc;
            margin-bottom: 16px;
            background-color: #ffffff;
        }
        textarea {
            padding: 12px;
            border: 1px solid #ccc;
            resize: vertical;
            min-height: 120px;
            margin-bottom: 16px;
            font-family: inherit;
            background-color: #ffffff;
        }
        .speed-box, .file-name-box, .voice-backup-box, .voice-source-box, .dictionary-box, .text-backup-box {
            margin-bottom: 16px;
            background: #fafafa;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #eee;
        }
        button {
            background-color: #ffffff;
            color: #2563eb;
            border: 1px solid #2563eb;
            padding: 12px;
            font-weight: 600;
            cursor: pointer;
            border-radius: 8px;
            transition: background-color 0.2s;
            margin-bottom: 10px;
        }
        button:hover:not(:disabled) { background-color: #eff6ff; }
        button:disabled { background-color: #f3f4f6; color: #9ca3af; border-color: #d1d5db; cursor: not-allowed; }
        .status {
            margin-top: 15px;
            font-size: 0.9rem;
            color: #555;
            text-align: center;
            min-height: 20px;
        }
        audio { width: 100%; margin-top: 10px; display: none; }
        .download-btn {
            background-color: #10b981 !important;
            color: white !important;
            border: 1px solid #10b981 !important;
            display: none;
        }
        .download-btn:hover:not(:disabled) { background-color: #059669 !important; }
        .backup-row, .dict-row {
            display: flex;
            gap: 10px;
        }
        .backup-row button, .dict-row button {
            flex: 1;
            font-size: 0.85rem;
            padding: 8px;
            background-color: #ffffff;
            color: #374151;
            border: 1px solid #d1d5db;
        }
        .backup-row button:hover, .dict-row button:hover { background-color: #e5e7eb; }
        input[type="file"] { display: none; }
        .dict-inputs {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
        }
        .dict-inputs input {
            margin-bottom: 0;
            background-color: #ffffff;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Kokoro-82M TTS - Comune Formīgine</h2>

    <div class="voice-source-box">
        <label for="initialSourceMode">Scegli la modalità di caricamento voci (Iniziale):</label>
        <select id="initialSourceMode">
            <option value="repo" selected>Il mio Repository GitHub (simonemenabue39-cpu/kokorosite - Online)</option>
            <option value="local">File Locali (.bin - Offline / Senza Internet)</option>
        </select>
        <button id="confirmSourceBtn" type="button" style="margin-top: 10px; background-color: #2563eb; color: white;">Conferma e Avvia Motore</button>
    </div>

    <div id="mainInterface" style="display: none;">
        <label for="voiceSelect">Scegli la voce italiana:</label>
        <select id="voiceSelect">
            <option value="if_sara">Sara (if_sara - Femminile Italiano)</option>
            <option value="im_nicola">Nicola (im_nicola - Maschile Italiano)</option>
        </select>

        <div class="dictionary-box">
            <label>Dizionario personalizzato (Pronuncia & Accenti):</label>
            <div class="dict-inputs">
                <input type="text" id="dictWord" placeholder="Parola (es. contattateci)">
                <input type="text" id="dictPhoneme" placeholder="Fonetica IPA (es. kontattˈate tʃi)">
            </div>
            <div class="dict-row">
                <button id="addDictBtn" type="button">Aggiungi / Aggiorna Voce</button>
            </div>
        </div>

        <div class="voice-backup-box">
            <label>Backup voci su PC:</label>
            <div class="backup-row">
                <button id="exportVoicesBtn" type="button">Salva Voci su File</button>
                <button id="importVoicesBtn" type="button">Carica Voci da File</button>
                <input type="file" id="importFileinput" accept=".bin" multiple>
            </div>
        </div>

        <div class="speed-box">
            <label for="speedRange">Velocità voce: <span id="speedVal">1.00</span>x</label>
            <input type="range" id="speedRange" min="0.7" max="1.4" step="0.05" value="1.0">
        </div>

        <div class="file-name-box">
            <label for="fileNameInput">Nome del file audio da scaricare:</label>
            <input type="text" id="fileNameInput" value="audio_formigine" placeholder="Inserisci il nome del file...">
        </div>

        <label for="textInput">Testo da sintetizzare:</label>
        <textarea id="textInput" placeholder="Inserisci il testo qui...">Benvenuti nel comune Formīgine. Contattateci al numero 059123456 oppure telefonate alle 8:15 o alle 10:30 il sabato 2025.</textarea>

        <div class="text-backup-box">
            <label>Gestione Testo:</label>
            <div class="backup-row">
                <button id="exportTextBtn" type="button">Salva Testo su File</button>
                <button id="importTextBtn" type="button">Carica Testo da File</button>
                <input type="file" id="importTextFileinput" accept=".txt" style="display: none;">
            </div>
        </div>

        <button id="generateBtn" disabled>Sintetizza Audio</button>
        <button id="downloadBtn" class="download-btn">Scarica File Audio</button>
    </div>

    <div class="status" id="statusText">Seleziona la sorgente delle voci per iniziare...</div>

    <audio id="audioPlayer" controls></audio>
</div>

<script>
    const SimJS = {
        voiceCache: {},
        async loadVoice(voiceName, sourceMode, onProgress, customFile = null) {
            if (this.voiceCache[voiceName] && !customFile) {
                if (onProgress) onProgress(`Voce "${voiceName}" pronta in memoria.`);
                return this.voiceCache[voiceName];
            }

            if (sourceMode === 'local' || customFile) {
                if (!customFile) {
                    if (this.voiceCache[voiceName]) return this.voiceCache[voiceName];
                    throw new Error(`Voce "${voiceName}" non trovata in memoria. Carica prima il file .bin corrispondente tramite "Carica Voci da File".`);
                }
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        try {
                            const buf = e.target.result;
                            const float32 = new Float32Array(buf);
                            if (float32.length >= 256) {
                                this.voiceCache[voiceName] = float32;
                                if (onProgress) onProgress(`Voce "${voiceName}" caricata da file locale.`);
                                resolve(float32);
                            } else {
                                reject(new Error("File voce non valido (troppo corto)."));
                            }
                        } catch (err) {
                            reject(err);
                        }
                    };
                    reader.onerror = (err) => reject(err);
                    reader.readAsArrayBuffer(customFile);
                });
            } else {
                const urls = [
                    `https://raw.githubusercontent.com/simonemenabue39-cpu/kokorosite/main/${voiceName}.bin`,
                    `https://raw.githubusercontent.com/simonemenabue39-cpu/kokorosite/master/${voiceName}.bin`,
                    `./${voiceName}.bin`
                ];

                for (const url of urls) {
                    try {
                        if (onProgress) onProgress(`Scaricamento voce "${voiceName}" dal repository GitHub...`);
                        const res = await fetch(url, { cache: "no-cache" });
                        if (res.ok) {
                            const buf = await res.arrayBuffer();
                            const float32 = new Float32Array(buf);
                            if (float32.length >= 256) {
                                this.voiceCache[voiceName] = float32;
                                if (onProgress) onProgress(`Voce "${voiceName}" scaricata con successo.`);
                                return float32;
                            }
                        }
                    } catch (e) {
                        console.warn(`Tentativo fallito su ${url}:`, e);
                    }
                }
                throw new Error(`Impossibile scaricare ${voiceName}.bin dal repository.`);
            }
        },
        exportVoices() {
            const keys = Object.keys(this.voiceCache);
            if (keys.length === 0) {
                alert("Nessuna voce attualmente in memoria da salvare.");
                return;
            }
            keys.forEach(voiceName => {
                const float32 = this.voiceCache[voiceName];
                const blob = new Blob([float32.buffer], { type: "application/octet-stream" });
                const link = document.createElement("a");
                link.href = URL.createObjectURL(blob);
                link.download = `${voiceName}.bin`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            });
        },
        async importVoiceFromFile(file) {
            return new Promise((resolve, reject) => {
                const voiceName = file.name.replace(/\.[^/.]+$/, "");
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const buf = e.target.result;
                        const float32 = new Float32Array(buf);
                        if (float32.length >= 256) {
                            this.voiceCache[voiceName] = float32;
                            resolve(voiceName);
                        } else {
                            reject(new Error("File voce non valido (troppo corto)."));
                        }
                    } catch (err) {
                        reject(err);
                    }
                };
                reader.onerror = (err) => reject(err);
                reader.readAsArrayBuffer(file);
            });
        }
    };
    window.SimJS = SimJS;
</script>

<script type="module">
    import { AutoTokenizer, AutoModel, Tensor, env } from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.4.1/+esm";

    env.allowLocalModels = false;
    env.useBrowserCache = true;

    const MODEL_ID = "onnx-community/Kokoro-82M-v1.0-ONNX";

    const initialSourceMode = document.getElementById("initialSourceMode");
    const confirmSourceBtn = document.getElementById("confirmSourceBtn");
    const mainInterface = document.getElementById("mainInterface");
    const generateBtn = document.getElementById("generateBtn");
    const downloadBtn = document.getElementById("downloadBtn");
    const statusText = document.getElementById("statusText");
    const textInput = document.getElementById("textInput");
    const voiceSelect = document.getElementById("voiceSelect");
    const speedRange = document.getElementById("speedRange");
    const speedVal = document.getElementById("speedVal");
    const audioPlayer = document.getElementById("audioPlayer");
    const fileNameInput = document.getElementById("fileNameInput");
    const exportVoicesBtn = document.getElementById("exportVoicesBtn");
    const importVoicesBtn = document.getElementById("importVoicesBtn");
    const importFileinput = document.getElementById("importFileinput");
    
    // Riferimenti per Gestione Testo
    const exportTextBtn = document.getElementById("exportTextBtn");
    const importTextBtn = document.getElementById("importTextBtn");
    const importTextFileinput = document.getElementById("importTextFileinput");

    const dictWordInput = document.getElementById("dictWord");
    const dictPhonemeInput = document.getElementById("dictPhoneme");
    const addDictBtn = document.getElementById("addDictBtn");

    let tokenizer = null;
    let model = null;
    let currentUrl = null;
    let currentWavBlob = null;
    let selectedSourceMode = "repo";

    speedRange.addEventListener("input", () => {
        speedVal.textContent = parseFloat(speedRange.value).toFixed(2);
    });

    const digitWords = {
        '0': 'zero', '1': 'uno', '2': 'due', '3': 'tre', '4': 'quattro',
        '5': 'cinque', '6': 'sei', '7': 'sette', '8': 'otto', '9': 'nove'
    };

    const hourWords = {
        0: 'zero', 1: 'una', 2: 'due', 3: 'tre', 4: 'quattro', 5: 'cinque',
        6: 'sei', 7: 'sette', 8: 'otto', 9: 'nove', 10: 'dieci', 11: 'undici',
        12: 'dodici', 13: 'tredici', 14: 'quattordici', 15: 'quindici',
        16: 'sedici', 17: 'diciassette', 18: 'diciotto', 19: 'diciannove',
        20: 'venti', 21: 'ventuno', 22: 'ventidue', 23: 'ventitré'
    };

    function numberToYearWords(numStr) {
        const n = parseInt(numStr, 10);
        if (n >= 2000 && n <= 2099) {
            const rem = n - 2000;
            if (rem === 0) return "duemila";
            return "duemila" + numberToWords(rem);
        } else if (n >= 1900 && n <= 1999) {
            const rem = n - 1900;
            if (rem === 0) return "milanovecento";
            return "milanovecento" + numberToWords(rem);
        }
        return numStr;
    }

    function numberToWords(n) {
        const units = ["", "uno", "due", "tre", "quattro", "cinque", "sei", "sette", "otto", "nove", "dieci", "undici", "dodici", "tredici", "quattordici", "quindici", "sedici", "diciassette", "diciotto", "diciannove"];
        const tens = ["", "", "venti", "trenta", "quaranta", "cinquanta", "sessanta", "settanta", "ottanta", "novanta"];
        if (n < 20) return units[n];
        if (n < 100) {
            let t = Math.floor(n / 10);
            let u = n % 10;
            let tStr = tens[t];
            if (u === 1 || u === 8) {
                tStr = tStr.slice(0, -1);
            }
            return tStr + units[u];
        }
        return n.toString();
    }

    const forcedItalianAccents = {
        "formigine": "formˈidʒine",
        "formīgine": "formˈidʒine",
        "contattateci": "kontattˈate tʃi",
        "contattate": "kontattˈate",
        "sabato": "sˈabato",
        "sabati": "sˈabati",
        "nascita": "nˈaʃʃita",
        "mortuaria": "mortuˈarja",
        "certificato": "tʃertifikˈato",
        "residenza": "residˈɛntsa",
        "cittadinanza": "tʃittadinˈantsa",
        "municipio": "munitʃˈipjo",
        "comune": "komˈune",
        "modena": "mˈɔdena",
        "emilia": "emˈilja",
        "telefono": "telˈɛfono",
        "telefonate": "telefonˈate",
        "numero": "nˈumero"
    };

    addDictBtn.addEventListener("click", () => {
        const word = dictWordInput.value.trim().toLowerCase();
        const phon = dictPhonemeInput.value.trim();
        if (!word || !phon) {
            alert("Inserisci sia la parola che la pronuncia fonetica IPA.");
            return;
        }
        forcedItalianAccents[word] = phon;
        dictWordInput.value = "";
        dictPhonemeInput.value = "";
        statusText.textContent = `Termine "${word}" aggiunto al dizionario con successo!`;
    });

    function preprocessItalianText(text) {
        let s = text;
        s = s.replace(/\b[nN]\.?\s*(?=\d)/g, "");
        s = s.replace(/\//g, " ");

        s = s.replace(/\b(dalle|alle)?\s*([0-1]?[0-9]|2[0-3]):15\b/gi, (match, prep, h) => {
            const prefix = prep ? prep.toLowerCase() + " " : "";
            return `${prefix}${hourWords[parseInt(h, 10)] || h} e un quarto`;
        });
        s = s.replace(/\b(dalle|alle)?\s*([0-1]?[0-9]|2[0-3]):30\b/gi, (match, prep, h) => {
            const prefix = prep ? prep.toLowerCase() + " " : "";
            return `${prefix}${hourWords[parseInt(h, 10)] || h} e mezza`;
        });
        s = s.replace(/\b(dalle|alle)?\s*([0-1]?[0-9]|2[0-3]):00\b/gi, (match, prep, h) => {
            const prefix = prep ? prep.toLowerCase() + " " : "";
            return `${prefix}${hourWords[parseInt(h, 10)] || h}`;
        });

        s = s.replace(/\b(19\d{2}|20\d{2})\b/g, (match) => {
            return numberToYearWords(match);
        });

        s = s.replace(/(?:\+39\s*)?\b\d{3,}\b/g, (match) => {
            return match.split('').map(char => digitWords[char] || char).join(', ');
        });

        s = s.toLowerCase();
        s = s.replace(/[’']/g, " ");

        s = s.replace(/\b[a-zàèéìòùīà]+\b/g, (word) => {
            if (forcedItalianAccents[word]) {
                return `__PHON_${forcedItalianAccents[word]}__`;
            }
            return word;
        });

        s = s.split(/(__PHON_[^_]+__)/g).map(segment => {
            if (segment.startsWith("__PHON_")) {
                return segment.replace("__PHON_", "").replace("__", "");
            }

            let part = segment;
            part = part.replace(/é/g, "ˈe").replace(/è/g, "ˈɛ").replace(/ò/g, "ˈɔ").replace(/à/g, "ˈa").replace(/ì/g, "ˈi").replace(/ù/g, "ˈu");

            part = part.replace(/gli(?=[aeiouɛɔ])/g, "ʎ");
            part = part.replace(/gli\b/g, "ʎi");
            part = part.replace(/gn/g, "ɲ");
            part = part.replace(/sc(?=[ieɛ])/g, "ʃ");
            part = part.replace(/sch/g, "sk");
            part = part.replace(/ch/g, "k");
            part = part.replace(/gh/g, "ɡ");
            part = part.replace(/ci(?=[aouɔ])/g, "tʃ");
            part = part.replace(/gi(?=[aouɔ])/g, "dʒ");
            part = part.replace(/c(?=[ieɛ])/g, "tʃ");
            part = part.replace(/g(?=[ieɛ])/g, "dʒ");
            part = part.replace(/c/g, "k");
            part = part.replace(/g/g, "ɡ");
            part = part.replace(/qu/g, "kw");
            part = part.replace(/q/g, "k");
            part = part.replace(/z/g, "ts");
            part = part.replace(/h/g, "");

            part = part.split(/\s+/).map(word => {
                if (!word || /ˈ/.test(word) || word.length <= 2) return word;
                const vowels = [...word.matchAll(/[aeiouɛɔ]/g)];
                if (vowels.length >= 2) {
                    const targetIdx = vowels[vowels.length - 2].index;
                    return word.slice(0, targetIdx) + "ˈ" + word.slice(targetIdx);
                }
                return word;
            }).join(" ");

            return part;
        }).join("");

        return s;
    }

    function splitIntoChunks(text, maxChars = 250) {
        const sentences = text.match(/[^.!?]+[.!?]+|\s*[^.!?]+$/g) || [text];
        let chunks = [];
        let currentChunk = "";

        for (const sentence of sentences) {
            if ((currentChunk + sentence).length <= maxChars) {
                currentChunk += sentence;
            } else {
                if (currentChunk) chunks.push(currentChunk.trim());
                currentChunk = sentence;
            }
        }
        if (currentChunk) chunks.push(currentChunk.trim());
        return chunks;
    }

    function encodeWAV(samples, sampleRate = 24000) {
        const buffer = new ArrayBuffer(44 + samples.length * 2);
        const view = new DataView(buffer);

        const writeStr = (offset, str) => {
            for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
        };

        writeStr(0, "RIFF");
        view.setUint32(4, 36 + samples.length * 2, true);
        writeStr(8, "WAVE");
        writeStr(12, "fmt ");
        view.setUint32(16, 16, true);
        view.setUint16(20, 1, true);
        view.setUint16(22, 1, true);
        view.setUint32(24, sampleRate, true);
        view.setUint32(28, sampleRate * 2, true);
        view.setUint16(32, 2, true);
        view.setUint16(34, 16, true);
        writeStr(36, "data");
        view.setUint32(40, samples.length * 2, true);

        let offset = 44;
        for (let i = 0; i < samples.length; i++, offset += 2) {
            const s = Math.max(-1, Math.min(1, samples[i]));
            view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
        }

        return new Blob([view], { type: "audio/wav" });
    }

    confirmSourceBtn.addEventListener("click", async () => {
        selectedSourceMode = initialSourceMode.value;
        document.querySelector(".voice-source-box").style.display = "none";
        mainInterface.style.display = "block";

        try {
            statusText.textContent = "Scaricamento tokenizer e modello Kokoro-82M...";
            tokenizer = await AutoTokenizer.from_pretrained(MODEL_ID);
            model = await AutoModel.from_pretrained(MODEL_ID, {
                dtype: "q8",
                device: "wasm"
            });

            if (selectedSourceMode === "repo") {
                statusText.textContent = "Download voce predefinita dal repository GitHub...";
                await window.SimJS.loadVoice("if_sara", "repo", (msg) => { statusText.textContent = msg; });
                statusText.textContent = "Kokoro Italiano pronto (Online)!";
            } else {
                statusText.textContent = "Modalità Offline attiva. Carica i file .bin delle voci dal pulsante sottostante.";
            }

            generateBtn.textContent = "Sintetizza Audio";
            generateBtn.disabled = false;
        } catch (error) {
            console.error("Errore inizializzazione:", error);
            statusText.textContent = "Errore caricamento: " + error.message;
        }
    });

    generateBtn.addEventListener("click", async () => {
        const rawText = textInput.value.trim();
        if (!rawText) {
            statusText.textContent = "Scrivi un testo prima di sintetizzare.";
            return;
        }

        const voiceName = voiceSelect.value;
        const speed = parseFloat(speedRange.value);

        generateBtn.disabled = true;
        downloadBtn.style.display = "none";
        audioPlayer.style.display = "none";
        statusText.textContent = "Elaborazione in corso...";

        try {
            const processedText = preprocessItalianText(rawText);
            const chunks = splitIntoChunks(processedText, 250);
            
            const voiceData = await window.SimJS.loadVoice(voiceName, selectedSourceMode, (msg) => { statusText.textContent = msg; });

            statusText.textContent = "Sintesi vocale fluida in corso...";
            const validWaveforms = [];

            for (let i = 0; i < chunks.length; i++) {
                const chunk = chunks[i];
                statusText.textContent = `Sintesi in corso... (parte ${i + 1} di ${chunks.length})`;
                
                await new Promise(resolve => setTimeout(resolve, 20));

                const encoded = tokenizer(chunk, { truncation: true, max_length: 510 });
                const rawIds = Array.from(encoded.input_ids.data);
                if (rawIds.length === 0) continue;

                const paddedIds = BigInt64Array.from([0n, ...rawIds.map(BigInt), 0n]);
                const inputIdsTensor = new Tensor("int64", paddedIds, [1, paddedIds.length]);

                const tokenCount = Math.min(rawIds.length, 509);
                const offset = tokenCount * 256;
                const styleSlice = voiceData.slice(offset, offset + 256);

                const styleTensor = new Tensor("float32", styleSlice, [1, 256]);
                const speedTensor = new Tensor("float32", new Float32Array([speed]), [1]);

                const outputs = await model({
                    input_ids: inputIdsTensor,
                    style: styleTensor,
                    speed: speedTensor
                });

                validWaveforms.push(outputs.waveform.data);
            }

            if (validWaveforms.length === 0) throw new Error("Nessun audio generato.");

            const silence = new Float32Array(2400);
            let totalLength = validWaveforms.reduce((acc, curr) => acc + curr.length, 0) + (validWaveforms.length - 1) * silence.length;

            const combinedWaveform = new Float32Array(totalLength);
            let offsetIdx = 0;

            for (let i = 0; i < validWaveforms.length; i++) {
                combinedWaveform.set(validWaveforms[i], offsetIdx);
                offsetIdx += validWaveforms[i].length;
                if (i < validWaveforms.length - 1) {
                    combinedWaveform.set(silence, offsetIdx);
                    offsetIdx += silence.length;
                }
            }

            currentWavBlob = encodeWAV(combinedWaveform, 24000);

            if (currentUrl) URL.revokeObjectURL(currentUrl);
            currentUrl = URL.createObjectURL(currentWavBlob);

            audioPlayer.src = currentUrl;
            audioPlayer.style.display = "block";
            downloadBtn.style.display = "block";
            await audioPlayer.play();

            statusText.textContent = "Sintesi completata!";
        } catch (error) {
            console.error("Errore sintesi:", error);
            statusText.textContent = "Errore durante la generazione: " + error.message;
        } finally {
            generateBtn.disabled = false;
            generateBtn.textContent = "Sintetizza Audio";
        }
    });

    downloadBtn.addEventListener("click", () => {
        if (!currentWavBlob) return;
        let customName = fileNameInput.value.trim();
        if (!customName) customName = "audio_output";
        if (!customName.endsWith(".wav")) customName += ".wav";

        const downloadLink = document.createElement("a");
        downloadLink.href = URL.createObjectURL(currentWavBlob);
        downloadLink.download = customName;
        document.body.appendChild(downloadLink);
        downloadLink.click();
        document.body.removeChild(downloadLink);
    });

    // Funzionalità Salva e Carica Testo
    exportTextBtn.addEventListener("click", () => {
        const textContent = textInput.value;
        const blob = new Blob([textContent], { type: "text/plain;charset=utf-8" });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = "testo_formigine.txt";
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    });

    importTextBtn.addEventListener("click", () => {
        importTextFileinput.click();
    });

    importTextFileinput.addEventListener("change", (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
            textInput.value = event.target.result;
            statusText.textContent = "Testo caricato con successo dal file!";
        };
        reader.onerror = () => {
            statusText.textContent = "Errore durante la lettura del file di testo.";
        };
        reader.readAsText(file);
    });

    voiceSelect.addEventListener("change", async () => {
        const voiceName = voiceSelect.value;
        try {
            await window.SimJS.loadVoice(voiceName, selectedSourceMode, (msg) => { statusText.textContent = msg; });
            statusText.textContent = `Voce "${voiceName}" pronta all'uso.`;
        } catch (e) {
            console.error(e);
            statusText.textContent = e.message;
        }
    });

    exportVoicesBtn.addEventListener("click", () => {
        window.SimJS.exportVoices();
    });

    importVoicesBtn.addEventListener("click", () => {
        importFileinput.click();
    });

    importFileinput.addEventListener("change", async (e) => {
        const files = e.target.files;
        if (!files || files.length === 0) return;
        statusText.textContent = "Caricamento voci da file in corso...";
        try {
            for (let file of files) {
                const name = await window.SimJS.importVoiceFromFile(file);
                console.log(`Voce ${name} importata con successo.`);
            }
            statusText.textContent = "Tutte le voci selezionate sono state caricate con successo!";
            generateBtn.disabled = false;
        } catch (err) {
            console.error(err);
            statusText.textContent = "Errore importazione file voce: " + err.message;
        }
    });
</script>

</body>
</html>
